<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register — Medimo</title>
</head>
<body>
    <h1>Buat akun Medimo</h1>
    <p>Simpan arsip kesehatan pribadimu.</p>

    {% if error %}
        <p role="alert">{{ error }}</p>
    {% endif %}

    {% if success %}
        <p role="status">Pendaftaran berhasil. Akunmu sudah tersimpan.</p>
    {% endif %}

    <form method="post" action="{{ url_for('register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <p>
            <label for="username">Username</label><br>
            <input
                id="username"
                name="username"
                type="text"
                value="{{ username }}"
                minlength="3"
                maxlength="30"
                pattern="[a-z0-9_]{3,30}"
                autocomplete="username"
                required
            >
        </p>
        <p>Gunakan 3–30 karakter: huruf kecil, angka, atau underscore.</p>

        <p>
            <label for="password">Password</label><br>
            <input
                id="password"
                name="password"
                type="password"
                minlength="15"
                autocomplete="new-password"
                required
            >
        </p>

        <p>
            <label for="confirm_password">Konfirmasi password</label><br>
            <input
                id="confirm_password"
                name="confirm_password"
                type="password"
                minlength="15"
                autocomplete="new-password"
                required
            >
        </p>

        <button type="submit">Daftar</button>
    </form>
</body>
</html>
