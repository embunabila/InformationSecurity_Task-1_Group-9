{% extends "auth_base.html" %}{% block title %}Log in — Medimo{% endblock %}{% block auth %}<span class="eyebrow">WELCOME BACK</span><h2>Log in to Medimo</h2><p class="muted">Access your personal health archive.</p>{% if error %}<div class="alert error" role="alert">{{ error }}</div>{% endif %}<form method="post" action="{{ url_for('login') }}" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="username">Username</label><input id="username" name="username" value="{{ username }}" autocomplete="username" placeholder="Enter your username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="button primary" type="submit">Log in <span>→</span></button></form><p class="auth-footer">Don’t have an account? <a href="{{ url_for('register') }}">Sign up</a></p>{% endblock %}
